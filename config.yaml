# clay-commute configuration
# Edit this file to customize your locations

# Home location (your starting point)
home:
  name: "Home"
  lat: 38.2097   # Shelbyville, KY
  lon: -85.2172

# Common destinations
destinations:
  work:
    name: "Work"
    lat: 38.1989
    lon: -85.3245
    address: "Downtown Louisville"
  
  school:
    name: "Silas's School"
    lat: 38.1856
    lon: -85.3890
    address: "Louisville"
  
  iris_school:
    name: "Iris's School"
    lat: 38.2120
    lon: -85.2015
    address: "Shelbyville"
  
  walmart:
    name: "Walmart"
    lat: 38.2156
    lon: -85.2689
    address: "Shelbyville"

  # Ferguson Plumbing Supply #0185 - Louisville (Robb's work site)
  # Verified via ferguson.com/store/ky/louisville/plumbingpvf-0185
  ferguson:
    name: "Ferguson #0185 Louisville"
    lat: 38.1775767
    lon: -85.6913307
    address: "4700 Poplar Level Road, Louisville, KY 40213-2402"
    hours: "Mon-Fri 0700-1630"

  # Downtown Georgetown, KY - separate town east of Louisville.
  # Do NOT confuse with the Ferguson store above; they are ~30 min apart.
  georgetown:
    name: "Downtown Georgetown"
    lat: 38.2055
    lon: -84.5597
    address: "Downtown Georgetown, KY"

  # Henry County Youth Soccer - John Logan Brent Park, New Castle, KY.
  # "Henry Co Parks" on the calendar = this park. Verified 2026-10-23:
  #  - Henry County Parks dept page (henrycounty.ky.gov/Departments/Pages/
  #    Parks.aspx) names "The John Logan Brent Park includes soccer and
  #    football fields" + the Michael Brent playground + Buchanan Splash Pad.
  #  - Henry County Youth Soccer Association plays its home games here.
  #  - Coordinates taken from the Google Maps POIs inside this park:
  #    Buchanan Splash Pad (325 Park Rd) 38.4460013, -85.1722306 and
  #    Michael Brent Playground 38.4459804, -85.1719003 (same campus).
  # NOTE: "Harry Hill Park" (311 Castle Hwy, 38.4095941, -85.1697203) is a
  # different county park 4.1 km away -- it is the Little League baseball
  # home, not the soccer fields. Do not substitute it.
  henry_park:
    name: "John Logan Brent Park (Henry Co Soccer)"
    lat: 38.4460013
    lon: -85.1722306
    address: "325 Park Rd, New Castle, KY 40050"

# Default destination when running `clay_commute.py check` without args
default_destination: work
